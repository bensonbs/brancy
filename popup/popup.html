<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brancy 雙語翻譯</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="ot-popup-container">
    <header class="ot-header">
      <div class="ot-brand"><div class="ot-logo" aria-hidden="true">b.</div><span class="ot-title">brancy</span></div>
      <button id="ot-open-options" class="ot-icon-btn" aria-label="開啟設定" title="設定"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg></button>
    </header>
    <div class="ot-intro"><h1>讀懂，更多。</h1><p>讓語言簡單一點。</p></div>
    <div class="ot-fields">
      <div class="ot-form-group"><label for="ot-engine-select">翻譯引擎</label><select id="ot-engine-select"><option value="google_free">Google 翻譯 · 免金鑰</option><option value="google_api">Google 翻譯 · 官方 API</option><option value="openrouter">OpenRouter · 自訂模型</option></select></div>
      <div id="ot-openrouter-hint" class="ot-hint-banner hidden"><span id="ot-current-model"></span><a href="#" id="ot-link-to-keys">設定</a></div>
      <div class="ot-form-group"><label for="ot-lang-select">翻譯成</label><select id="ot-lang-select"><option value="zh-TW">繁體中文</option><option value="zh-CN">簡體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
    </div>
    <button id="ot-configure" class="ot-btn-primary"><span>翻譯設定</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
    <p class="ot-shortcut-hint">在網頁按右鍵，即可翻譯或還原原文</p>
    <div class="ot-switches">
      <div class="ot-switch-row"><div><label for="ot-sw-yt-subs">YouTube 雙語字幕</label><p>影片中的雙語對照</p></div><label class="ot-toggle"><input type="checkbox" id="ot-sw-yt-subs" role="switch"><span class="ot-slider"></span></label></div>
      <div class="ot-switch-row"><div><label for="ot-sw-selection">劃詞翻譯</label><p>選取文字，即時讀懂</p></div><label class="ot-toggle"><input type="checkbox" id="ot-sw-selection" role="switch"><span class="ot-slider"></span></label></div>
    </div>
    <p id="ot-status" class="ot-status" role="status" hidden></p>
    <footer class="ot-footer"><button id="ot-clear-cache">清除快取</button><span>簡單・輕量・開源</span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
